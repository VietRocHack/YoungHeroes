name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: vietrochack-lab
  REGION: us-central1
  SERVICE_NAME: youngheroes-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation — no stored key

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --source=backend \
            --region="$REGION" \
            --allow-unauthenticated \
            --max-instances=3 \
            --concurrency=20 \
            --timeout=300 \
            --set-secrets=GEMINI_API_KEY=youngheroes-gemini-api-key:latest \
            --project="$PROJECT_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        # App Check (docs/adr/0006-abuse-prevention.md) — inert while unset.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

      - name: Deploy frontend to Firebase Hosting
        run: |
          npx firebase-tools deploy --only hosting:youngheroes \
            --project "$PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend service: $SERVICE_NAME ($REGION)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: https://youngheroes.vietrochack.com" >> "$GITHUB_STEP_SUMMARY"
